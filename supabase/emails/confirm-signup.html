<!doctype html>
<html lang="bg">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Plauvia</title>
  </head>
  <body style="margin:0;padding:0;background:#f6f7fb;">
    <!-- The line shown in the inbox list, next to the subject. -->
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;">Кодът за потвърждение на профила ти в Plauvia.</div>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f6f7fb;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                 style="max-width:480px;background:#ffffff;border:1px solid #dfe4ef;border-radius:16px;">
            <tr>
              <td style="padding:28px 28px 0 28px;">
                <img src="https://www.plauvia.com/icons/icon-192.png" width="36" height="36" alt="Plauvia"
                     style="display:block;border:0;border-radius:10px;">
              </td>
            </tr>
            <tr>
              <td style="padding:20px 28px 0 28px;">
                <h1 style="margin:0;font:600 23px/1.25 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
                           letter-spacing:-0.5px;color:#0e1116;">Потвърди профила си</h1>
                <p style="margin:12px 0 0 0;font:400 15px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
                          color:#4d5568;">Въведи този код в Plauvia, за да активираш профила си. Валиден е за около час.</p>
              </td>
            </tr>
            <tr>
              <td style="padding:24px 28px 0 28px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td align="center" style="background:#f6f7fb;border:1px solid #dfe4ef;border-radius:12px;padding:20px 12px;">
                      <div style="font:600 34px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
                                  letter-spacing:9px;color:#0e1116;">{{ .Token }}</div>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:20px 28px 28px 28px;">
                <p style="margin:0;font:400 13px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
                          color:#6d768c;">Ако не си създавал профил, не прави нищо — без този код профилът не се активира и адресът ти остава свободен.</p>
              </td>
            </tr>
          </table>

          <p style="margin:18px 0 0 0;font:400 12px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
                    color:#6d768c;">
            Plauvia · <a href="https://www.plauvia.com" style="color:#1857d6;text-decoration:none;">plauvia.com</a>
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
