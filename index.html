<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <!-- Pinch-zoom stays available: blocking it locks out anyone who needs to
         magnify. The drawing surface sets touch-action itself, so a stylus
         stroke is still never mistaken for a gesture. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Plauvia — From plan to progress.</title>
    <meta
      name="description"
      content="Plan, study, focus and track. Plauvia keeps your textbooks, whiteboards, flashcards and study time in one place — and works offline."
    />
    <link rel="canonical" href="https://www.plauvia.com/" />

    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <!-- Google picks the favicon for a search result from these, and ignores
         anything under 48px. Without one it draws a grey globe where the mark
         should be. -->
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <link rel="preload" href="/fonts/inter.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-cyrillic.woff2" as="font" type="font/woff2" crossorigin />

    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f7fb" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#080a0f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Plauvia" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="application-name" content="Plauvia" />

    <meta property="og:site_name" content="Plauvia" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.plauvia.com/" />
    <meta property="og:title" content="Plauvia — From plan to progress." />
    <meta
      property="og:description"
      content="Plan, study, focus and track. Textbooks, whiteboards, flashcards and your study time in one place."
    />
    <meta property="og:image" content="https://www.plauvia.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Plauvia — from plan to progress." />
    <meta property="og:locale" content="bg_BG" />
    <meta property="og:locale:alternate" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Plauvia — From plan to progress." />
    <meta
      name="twitter:description"
      content="Plan, study, focus and track. Textbooks, whiteboards, flashcards and your study time in one place."
    />
    <meta name="twitter:image" content="https://www.plauvia.com/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
