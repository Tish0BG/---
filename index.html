<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <!-- Pinch-zoom stays available: blocking it locks out anyone who needs to
         magnify. The drawing surface sets touch-action itself, so a stylus
         stroke is still never mistaken for a gesture. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!--
      Everything between the two markers is written by the build, once per
      public page and once per language, from the table in `src/seo/routes.ts`.
      What is here is what `/` serves and what the dev server shows: the
      Bulgarian home page. Editing a title by hand here would last exactly
      until the next build — the table is the place.
    -->
    <!--seo-->
    <title>Plauvia — От план към резултат.</title>
    <meta
      name="description"
      content="Планирай, учи, фокусирай се и следи напредъка. Plauvia държи учебниците, дъските, флашкартите и учебното време на едно място — и работи офлайн."
    />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://www.plauvia.com/" />
    <link rel="alternate" hreflang="bg" href="https://www.plauvia.com/" />
    <link rel="alternate" hreflang="en" href="https://www.plauvia.com/en" />
    <link rel="alternate" hreflang="x-default" href="https://www.plauvia.com/" />

    <meta property="og:site_name" content="Plauvia" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.plauvia.com/" />
    <meta property="og:title" content="Plauvia — От план към резултат." />
    <meta
      property="og:description"
      content="Планирай, учи, фокусирай се и следи напредъка. Plauvia държи учебниците, дъските, флашкартите и учебното време на едно място — и работи офлайн."
    />
    <meta property="og:image" content="https://www.plauvia.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Plauvia — От план към резултат." />
    <meta property="og:locale" content="bg_BG" />
    <meta property="og:locale:alternate" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Plauvia — От план към резултат." />
    <meta
      name="twitter:description"
      content="Планирай, учи, фокусирай се и следи напредъка. Plauvia държи учебниците, дъските, флашкартите и учебното време на едно място — и работи офлайн."
    />
    <meta name="twitter:image" content="https://www.plauvia.com/og.png" />
    <meta name="twitter:image:alt" content="Plauvia — От план към резултат." />
    <!--/seo-->

    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <!-- Google picks the favicon for a search result from these, and ignores
         anything under 48px. Without one it draws a grey globe where the mark
         should be. -->
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <link rel="preload" href="/fonts/inter.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-cyrillic.woff2" as="font" type="font/woff2" crossorigin />

    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f7fb" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#080a0f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Plauvia" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="application-name" content="Plauvia" />
  </head>
  <body>
    <div id="root"></div>
    <!--fallback--><!--/fallback-->
    <script type="module" src="/src/main.tsx"></script>
    <!-- Runs even when the line above fails to. See the file. -->
    <script src="/recover.js" defer></script>
  </body>
</html>
